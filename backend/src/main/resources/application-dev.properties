# ===== DEV PROFILE =====
spring.datasource.url=jdbc:mysql://localhost:3306/admarket_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.billboard.marketplace=DEBUG
logging.level.org.springframework.security=DEBUG

app.storage.upload-dir=uploads/dev
app.storage.base-url=http://localhost:8080
