# Common configuration. Profile-specific datasource settings live in
# application-dev.yml (H2) and application-prod.yml (PostgreSQL).
spring:
  application:
    name: theadbasket-backend
  profiles:
    default: dev
  jpa:
    # Flyway owns the schema; Hibernate only validates entities against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  # External, hot-reloadable feature policy (which roles / auth providers are
  # currently enabled). Lives outside the jar so it can be edited without a
  # rebuild; see app.roles / app.auth-providers below.
  config:
    import: optional:file:./config/feature-policy.yml

server:
  port: 8080

management:
  server:
    # Actuator (including /refresh) is served on a separate port so it is never
    # exposed on the same listener as the public API. This port must be firewalled
    # to internal/ops access only in every real deployment.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh,env
  endpoint:
    health:
      probes:
        enabled: true
    refresh:
      # Access control is enforced by ActuatorSecurityConfig (HTTP Basic), not here.
      access: unrestricted

info:
  app:
    name: The AdBasket Backend
    description: REST API for the OOH advertising marketplace

app:
  jwt:
    # HS256 signing secret (>= 32 chars). MUST be overridden in prod via JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-min-32-chars-please}
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  google:
    # OAuth 2.0 Web client id. The ID token's audience must match this. Set via GOOGLE_CLIENT_ID.
    # Leave blank to disable Google sign-in.
    client-id: ${GOOGLE_CLIENT_ID:}
    token-info-uri: ${GOOGLE_TOKENINFO_URI:https://oauth2.googleapis.com/tokeninfo}
  auth:
    # Password policy for new/updated passwords (BCrypt truncates beyond 72 bytes).
    password-min-length: ${AUTH_PASSWORD_MIN_LENGTH:8}
    password-max-length: ${AUTH_PASSWORD_MAX_LENGTH:72}
    # Role assigned to a fresh identity-only account.
    default-role: ${AUTH_DEFAULT_ROLE:MEMBER}
  cors:
    # Comma-separated browser origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  actuator:
    # Credentials for the actuator-only Basic Auth chain (ActuatorSecurityConfig).
    # MUST be overridden in prod via env vars — never rely on these defaults outside dev.
    username: ${ACTUATOR_ADMIN_USER:admin}
    password: ${ACTUATOR_ADMIN_PASSWORD:dev-only-change-me}
  # roles / auth-providers below are bound by RolePolicyProperties /
  # AuthProviderPolicyProperties (@RefreshScope) — these are the compiled-in
  # defaults used if config/feature-policy.yml is absent or a key is omitted.
  # The external file (imported above) is the source of truth in real deployments.
  roles:
    enabled: [MEMBER, ADVERTISER, OWNER, AGENCY]
  auth-providers:
    enabled: [LOCAL, GOOGLE]