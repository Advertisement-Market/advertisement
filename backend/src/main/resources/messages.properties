# User-facing error messages, keyed by ErrorCode.messageKey().
# Resolved via MessageSource in GlobalExceptionHandler; add locale variants as
# messages_<lang>.properties (e.g. messages_hi.properties) for i18n.
# {0}, {1}, ... are positional arguments supplied at the throw site.

# Auth / credentials
error.auth.invalidCredentials=Invalid email or password.
error.auth.passwordLength=Password must be {0}-{1} characters.
error.auth.passwordRequired=Password is required to create an account.
error.auth.loginEmailRequired=Login email is required to create an account.
error.auth.sessionInvalid=Your session is no longer valid. Please sign in again.

# Registration
error.email.alreadyExists=An account already exists for email: {0}
error.registration.alreadyRegistered=This account is already registered as {0}.

# Account / resources
error.account.notFound=Account not found.

# Google sign-in
error.google.notConfigured=Google sign-in is not configured on the server.
error.google.credentialMissing=Missing Google credential.
error.google.verificationFailed=Google could not verify this sign-in. Please try again.
error.google.incompleteProfile=Google returned an incomplete profile.
error.google.audienceMismatch=This Google sign-in was not issued for The AdBasket.

# Refresh tokens
error.token.invalid=Refresh token is invalid.
error.token.revoked=Refresh token has been revoked.
error.token.expired=Refresh token has expired. Please sign in again.

# Generic
error.validation.failed=Validation failed.
error.internal=An unexpected error occurred. Please try again later.
