# Staging profile — PostgreSQL. Values come from environment variables.
# Run with: --spring.profiles.active=staging
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adbasket}
    username: ${DB_USERNAME:adbasket}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET lock_timeout = '5s'"
  flyway:
    # Dedicated Flyway connection ensures session-scoped 'lock_timeout = 0'
    # never touches or leaks into the application's Hikari connection pool.
    # Uses spring.datasource.* properties to guarantee identical target coordinates.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password:${DB_PASSWORD:}}
    init-sqls:
      - "SET lock_timeout = 0"

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.theadbasket: INFO

server:
  forward-headers-strategy: framework

app:
  cookie:
    secure: true
    same-site: Strict

