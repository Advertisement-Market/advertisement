spring.application.name=billboard-marketplace
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/marketplace
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mysql@1234}
spring.jpa.show-sql=true
# Active profile (override with -Dspring.profiles.active=prod)
spring.profiles.active=dev

# JPA common settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Local file storage root (can be overridden per profile)
app.storage.upload-dir=uploads
app.storage.base-url=http://localhost:8080

# JWT settings (override secrets via env vars in prod)
app.jwt.secret=${JWT_SECRET:ThisIsADefaultDevSecretKeyThatShouldBeChangedInProduction!@#$}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# Logging
logging.level.com.billboard.marketplace=DEBUG
