# Development profile — in-memory H2 (PostgreSQL compatibility mode).
spring:
  datasource:
    url: jdbc:h2:mem:adbasket;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    # Show method entry/exit + timing (LoggingAspect) while developing.
    com.theadbasket: DEBUG
