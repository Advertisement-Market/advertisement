# Production profile — PostgreSQL. Values come from environment variables
# (see .env.example). Run with: --spring.profiles.active=prod
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adbasket}
    username: ${DB_USERNAME:adbasket}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    # Keep entry/exit DEBUG noise out of prod; business INFO/WARN/ERROR still logged.
    com.theadbasket: INFO
