name: advertisement

services:
  advertisement-db:
    image: postgres:16-alpine
    container_name: advertisement-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adbasket}
      POSTGRES_USER: ${POSTGRES_USER:-adbasket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adbasket_secret_pass}
    volumes:
      - ${DB_DATA_PATH:-advertisement_db_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-adbasket} -d $${POSTGRES_DB:-adbasket}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  advertisement-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/advertisement-market/advertisement-backend:latest}
    container_name: advertisement-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://advertisement-db:5432/${POSTGRES_DB:-adbasket}
      DB_USERNAME: ${POSTGRES_USER:-adbasket}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-adbasket_secret_pass}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-please}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://theadbasket.bytepod.in,http://192.168.0.100:8086,http://localhost:8086,http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    depends_on:
      advertisement-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  advertisement-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: ${FRONTEND_IMAGE:-ghcr.io/advertisement-market/advertisement-frontend:latest}

    container_name: advertisement-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8086}:80"
    depends_on:
      - advertisement-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  advertisement_db_data:
    driver: local
