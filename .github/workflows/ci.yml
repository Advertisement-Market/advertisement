name: Build and Test CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-check:
    name: PR Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR documentation compliance
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          chmod +x .github/scripts/check-pr-docs.sh
          .github/scripts/check-pr-docs.sh

  frontend-ci:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code style check (Prettier)
        run: npm run format:check

      - name: Lint check (ESLint)
        run: npm run lint

      - name: Run Unit Tests with Coverage (Vitest)
        run: npm run test:coverage

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Build production bundle
        run: npm run build

  backend-ci:
    name: Backend (Maven Test & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test, and verify coverage (Maven & JaCoCo)
        run: mvn clean verify

      - name: Upload Backend JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  ci-status-check:
    name: CI / All Checks Passed
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, docs-check]
    if: always()
    steps:
      - name: Evaluate status check
        run: |
          if [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.docs-check.result }}" != "success" ]; then
            echo "CI pipeline checks failed!"
            exit 1
          fi
          echo "All CI pipeline checks passed successfully!"
