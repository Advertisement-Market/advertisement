name: Build and Test CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code style check (Prettier)
        run: npm run format:check

      - name: Lint check (ESLint)
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend-ci:
    name: Backend (Maven Test & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test, and package application
        run: mvn clean verify

  ci-status-check:
    name: CI / All Checks Passed
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: always()
    steps:
      - name: Evaluate status check
        run: |
          if [ "${{ needs.frontend-ci.result }}" != "success" ] || [ "${{ needs.backend-ci.result }}" != "success" ]; then
            echo "CI pipeline checks failed!"
            exit 1
          fi
          echo "All CI pipeline checks passed successfully!"
